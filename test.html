<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model Viewer</title>
  
  <!-- Import the <model-viewer> web component library -->
  <script type="module" src="https://googleapis.com"></script>

  <style>
    /* Give the viewer a designated size on the page */
    model-viewer {
      width: 100%;
      height: 500px;
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>

  <!-- 3D Viewer Element -->
  <model-viewer 
    src="models/basic-block.glb" 
    alt="A 3D model of a basic block" 
    camera-controls 
    auto-rotate 
    ar>
  </model-viewer>

</body>
</html>
